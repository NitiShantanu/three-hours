<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,650&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #eef1ea;
    --surface: #f8faf6;
    --surface-2: #e2e6dc;
    --ink: #1d2a20;
    --ink-muted: #5b665c;
    --border: #d3d9c9;
    --border-soft: #dee2d5;
    --accent: #2b6e6a;
    --accent-strong: #1e4f4c;
    --accent-ink: #f4faf8;
    --good: #4c7a52;
    --good-bg: #e2ecdf;
    --warn: #a9711f;
    --warn-bg: #f3e6cd;
    --critical: #a1462f;
    --critical-bg: #f4ddd4;
    --shadow: 0 1px 2px rgba(29,42,32,0.06), 0 8px 24px -16px rgba(29,42,32,0.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14170f;
      --surface: #1b1f16;
      --surface-2: #262b1f;
      --ink: #e8ece1;
      --ink-muted: #98a08e;
      --border: #333a2b;
      --border-soft: #2a3023;
      --accent: #5cb3ac;
      --accent-strong: #7ecac3;
      --accent-ink: #0d1712;
      --good: #86c58a;
      --good-bg: #23301f;
      --warn: #e3b45c;
      --warn-bg: #332a17;
      --critical: #e28a72;
      --critical-bg: #35211b;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -16px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14170f;
    --surface: #1b1f16;
    --surface-2: #262b1f;
    --ink: #e8ece1;
    --ink-muted: #98a08e;
    --border: #333a2b;
    --border-soft: #2a3023;
    --accent: #5cb3ac;
    --accent-strong: #7ecac3;
    --accent-ink: #0d1712;
    --good: #86c58a;
    --good-bg: #23301f;
    --warn: #e3b45c;
    --warn-bg: #332a17;
    --critical: #e28a72;
    --critical-bg: #35211b;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -16px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Work Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .shell { max-width: 640px; margin: 0 auto; padding: 0 16px 64px; }

  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    padding: 18px 0 10px;
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 650;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0;
  }
  .today-chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
    text-align: right;
    white-space: nowrap;
  }

  .tabs { display: flex; gap: 2px; margin-top: 14px; background: var(--surface-2); border-radius: 8px; padding: 3px; }
  .tab-btn {
    flex: 1; border: none; background: transparent; color: var(--ink-muted);
    font: inherit; font-size: 0.86rem; font-weight: 600; padding: 8px 6px; border-radius: 6px;
    cursor: pointer; letter-spacing: 0.01em;
  }
  .tab-btn[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .tab-btn:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  main { padding-top: 20px; display: flex; flex-direction: column; gap: 28px; }

  .eyebrow {
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--ink-muted); margin: 0 0 10px;
  }

  .budget {
    display: flex; flex-direction: column; gap: 6px;
  }
  .budget-row { display: flex; justify-content: space-between; align-items: baseline; }
  .budget-label { font-size: 0.86rem; color: var(--ink-muted); }
  .budget-figure { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
  .budget-track { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .budget-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .budget-fill.over { background: var(--critical); }
  .budget-note { font-size: 0.78rem; color: var(--critical); }

  function urgencyTag(t, today) {
    var u = urgencyOf(t, today);
    if (t.category === "ondemand") return { label: "on demand", tone: "" };
    if (u.ratio === Infinity) return { label: "never logged", tone: "critical" };
    if (u.ratio >= 1.5) return { label: u.daysOverdue + "d overdue", tone: "critical" };
    if (u.ratio >= 1) return { label: u.daysOverdue + "d overdue", tone: "warn" };
    var dueIn = Math.round(intervalDays(t) - daysBetween(u.lastDone, today));
    return { label: "due in " + dueIn + "d", tone: "" };
  }

  // ---------- today's plan ----------
  function computeTodayPlan() {
    var today = todayISO();
    var wd = todayWeekday();
    var ov = state.overrides[today] || { added: [], removed: [] };
    var budget = (ov.budgetOverride != null) ? ov.budgetOverride : state.settings.dailyBudgetMins;

    var daily = state.tasks.filter(function (t) { return t.category === "daily" && ov.removed.indexOf(t.id) === -1; });

    var weekdayCandidates = state.tasks.filter(function (t) { return t.category === "weekday" && t.weekday === wd; });
    weekdayCandidates.sort(function (a, b) { return urgencyOf(b, today).ratio - urgencyOf(a, today).ratio; });
    var dueWeekday = weekdayCandidates.filter(function (t) { return urgencyOf(t, today).ratio >= 0.75; });
    // business rule: never run two fixed weekday tasks the same day -- take the most overdue one only
    var selectedWeekday = dueWeekday.length ? [dueWeekday[0]] : [];
    selectedWeekday = selectedWeekday.filter(function (t) { return ov.removed.indexOf(t.id) === -1; });

    var required = daily.concat(selectedWeekday);
    var added = state.tasks.filter(function (t) { return ov.added.indexOf(t.id) !== -1; });
    // count anything manually added toward "used" FIRST, so the auto-fill below knows
    // how much room is actually left rather than always filling to the full budget.
    var used = required.concat(added).reduce(function (s, t) { return s + t.timeMins; }, 0);

    var pool = state.tasks.filter(function (t) { return t.category === "rotating"; });
    pool.sort(function (a, b) { return urgencyOf(b, today).ratio - urgencyOf(a, today).ratio; });

    var suggested = [];
    pool.forEach(function (t) {
      if (ov.removed.indexOf(t.id) !== -1) return;
      if (ov.added.indexOf(t.id) !== -1) return;
      if (used + t.timeMins <= budget) { suggested.push(t); used += t.timeMins; }
    });

    var finalList = required.concat(suggested).concat(added);
    var shownIds = finalList.map(function (t) { return t.id; });

    var poolRemaining = pool.filter(function (t) {
      return shownIds.indexOf(t.id) === -1;
    });
    var onDemand = state.tasks.filter(function (t) { return t.category === "ondemand" && shownIds.indexOf(t.id) === -1; });
    var otherWeekday = weekdayCandidates.filter(function (t) { return shownIds.indexOf(t.id) === -1; });
    // daily tasks removed for today have nowhere else to live -- surface them so they can be swapped back in
    var removedDaily = state.tasks.filter(function (t) {
      return t.category === "daily" && ov.removed.indexOf(t.id) !== -1;
    });

    return {
      today: today, weekday: wd, budget: budget, used: used,
      defaultBudget: state.settings.dailyBudgetMins, budgetOverridden: ov.budgetOverride != null,
      required: required, suggested: suggested, added: added, finalList: finalList, removedDaily: removedDaily,
      poolRemaining: poolRemaining, onDemand: onDemand, otherWeekday: otherWeekday,
      overflow: used > budget
    };
  }

  // ---------- persistence ----------
  function persist(mutate) {
    mutate(state);
    document.getElementById("state-json").textContent = JSON.stringify(state);
    renderApp();
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) {}
    if (artifactApi && artifactApi.publish) {
      var html = "<!doctype html>\n" + document.documentElement.outerHTML;
      artifactApi.publish(html).catch(function () {});
    }
  }

  function toggleDone(taskId) {
    persist(function (s) {
      var today = todayISO();
      if (!s.history[today]) s.history[today] = [];
      var idx = s.history[today].indexOf(taskId);
      if (idx === -1) s.history[today].push(taskId); else s.history[today].splice(idx, 1);
    });
  }
  function removeFromToday(taskId) {
    persist(function (s) {
      var today = todayISO();
      if (!s.overrides[today]) s.overrides[today] = { added: [], removed: [] };
      var ov = s.overrides[today];
      ov.added = ov.added.filter(function (id) { return id !== taskId; });
      if (ov.removed.indexOf(taskId) === -1) ov.removed.push(taskId);
    });
  }
  function addToToday(taskId) {
    persist(function (s) {
      var today = todayISO();
      if (!s.overrides[today]) s.overrides[today] = { added: [], removed: [] };
      var ov = s.overrides[today];
      ov.removed = ov.removed.filter(function (id) { return id !== taskId; });
      if (ov.added.indexOf(taskId) === -1) ov.added.push(taskId);
    });
  }
  function setTodayBudget(mins) {
    persist(function (s) {
      var today = todayISO();
      if (!s.overrides[today]) s.overrides[today] = { added: [], removed: [] };
      if (mins === s.settings.dailyBudgetMins) { delete s.overrides[today].budgetOverride; }
      else { s.overrides[today].budgetOverride = mins; }
    });
  }
  function resetTodayBudget() {
    persist(function (s) {
      var today = todayISO();
      if (s.overrides[today]) delete s.overrides[today].budgetOverride;
    });
  }
  function setBootstrap(taskId, iso) {
    persist(function (s) {
      var t = s.tasks.find(function (x) { return x.id === taskId; });
      if (t) t.bootstrapDate = iso;
    });
  }
  function finishBootstrap() {
    persist(function (s) { s.settings.bootstrapDone = true; });
    currentTab = "today";
    renderApp();
  }
  function saveSettings(email, budget) {
    persist(function (s) {
      s.settings.wifeEmail = email;
      s.settings.dailyBudgetMins = Math.max(30, Math.min(600, budget || 180));
    });
  }
  function addCustomTask(fields) {
    var id = uniqueTaskId(fields.name);
    persist(function (s) {
      s.tasks.push({
        id: id,
        name: fields.name,
        category: fields.category,
        timeMins: fields.timeMins,
        freqPerMonth: (fields.category === "rotating" || fields.category === "weekday") ? fields.freqPerMonth : null,
        weekday: fields.category === "weekday" ? fields.weekday : null,
        bootstrapDate: fields.lastDone || null
      });
    });
    return id;
  }

  // ---------- rendering ----------
  function render() { renderApp(); }

  function renderApp() {
    var app = document.getElementById("app");
    var today = todayISO();
    app.innerHTML =
      renderTopbar(today) +
      '<main>' + renderTab() + '</main>' +
      '<footer class="credit">Three Hours &middot; built around a 3-hour daily visit</footer>';
    wireEvents();
  }

  function renderTopbar(today) {
    var tabs = [["today", "Today"], ["library", "Library"], ["history", "History"], ["settings", "Settings"]];
    return '' +
    '<div class="topbar">' +
      '<div class="topbar-row">' +
        '<h1 class="brand">Three Hours</h1>' +
        '<div class="today-chip">' + escapeHtml(fmtDateLong(today)) + '</div>' +
      '</div>' +
      '<div class="tabs" role="tablist">' +
        tabs.map(function (t) {
          return '<button class="tab-btn" role="tab" data-tab="' + t[0] + '" aria-selected="' + (currentTab === t[0]) + '">' + t[1] + '</button>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  function renderTab() {
    if (!state.settings.bootstrapDone && currentTab === "today") currentTab = "library";
    if (currentTab === "today") return renderToday();
    if (currentTab === "library") return renderLibrary();
    if (currentTab === "history") return renderHistory();
    return renderSettings();
  }

  function rowHtml(t, opts) {
    opts = opts || {};
    var today = todayISO();
    var doneToday = (state.history[today] || []).indexOf(t.id) !== -1;
    var tagInfo = urgencyTag(t, today);
    var tags = '<span class="tag' + (tagInfo.tone ? ' ' + tagInfo.tone : '') + '">' + escapeHtml(tagInfo.label) + '</span>';
    if (t.category === "daily") tags = '<span class="tag">daily</span>';
    if (t.category === "weekday") tags += ' <span class="tag">' + escapeHtml(t.weekday) + '</span>';
    var actionBtn = opts.onAdd
      ? '<button class="icon-btn add" data-add="' + t.id + '" title="Add to today" aria-label="Add to today">+</button>'
      : (opts.removable !== false ? '<button class="icon-btn" data-remove="' + t.id + '" title="Remove from today" aria-label="Remove from today">&times;</button>' : '');
    return '' +
    '<div class="row' + (doneToday ? ' done' : '') + '">' +
      (opts.onAdd ? '' : '<input type="checkbox" class="check" data-toggle="' + t.id + '" ' + (doneToday ? 'checked' : '') + ' aria-label="Mark ' + escapeHtml(t.name) + ' done" />') +
      '<div class="row-body"><span class="row-name">' + escapeHtml(t.name) + '</span><span class="row-tags">' + tags + '</span></div>' +
      '<span class="chip-time">' + fmtDuration(t.timeMins) + '</span>' +
      actionBtn +
    '</div>';
  }

  function renderToday() {
    var plan = computeTodayPlan();
    var pct = Math.min(100, Math.round((plan.used / plan.budget) * 100));
    var out = '';

    out += '<section>' +
      '<div class="budget">' +
        '<div class="budget-row"><span class="budget-label">' + escapeHtml(plan.weekday) + '&rsquo;s plan</span>' +
        '<span class="budget-figure">' + fmtDuration(plan.used) + ' / ' + fmtDuration(plan.budget) + '</span></div>' +
        '<div class="budget-track"><div class="budget-fill' + (plan.overflow ? ' over' : '') + '" style="width:' + pct + '%"></div></div>' +
        (plan.overflow ? '<div class="budget-note">Running ' + fmtDuration(plan.used - plan.budget) + ' over the ' + fmtDuration(plan.budget) + ' available today.</div>' : '') +
        '<div class="quickset" style="align-items:center;">' +
          '<span class="section-sub">Maid&rsquo;s here for</span>' +
          '<input class="datein" type="number" min="15" max="600" step="5" id="today-budget-input" value="' + plan.budget + '" style="width:60px;" />' +
          '<span class="section-sub">min today</span>' +
          (plan.budgetOverridden ? '<button class="qbtn" data-action="reset-today-budget">reset to usual (' + fmtDuration(plan.defaultBudget) + ')</button>' : '') +
        '</div>' +
      '</div>' +
    '</section>';

    out += '<section>' +
      '<div class="section-head"><h2 class="section-title">Today’s list</h2><span class="section-sub">tap to check off</span></div>' +
      '<div class="list">' +
        (plan.finalList.length ? plan.finalList.map(function (t) { return rowHtml(t); }).join('') : '<div class="empty-note">Nothing scheduled &mdash; everything’s caught up.</div>') +
      '</div>' +
    '</section>';

    if (plan.onDemand.length) {
      out += '<section>' +
        '<div class="section-head"><h2 class="section-title">Need something extra today?</h2><span class="section-sub">only added when asked</span></div>' +
        '<div class="list">' +
          plan.onDemand.map(function (t) { return rowHtml(t, { onAdd: true }); }).join('') +
        '</div>' +
      '</section>';
    }

    var poolItems = plan.poolRemaining.concat(plan.otherWeekday).concat(plan.removedDaily);
    poolItems.sort(function (a, b) { return a.name.localeCompare(b.name); });
    out += '<section>' +
      '<details class="pool">' +
        '<summary><span>Swap in something else (' + poolItems.length + ')</span><span class="caret">&#9656;</span></summary>' +
        '<div class="list">' +
          (poolItems.length ? poolItems.map(function (t) { return rowHtml(t, { onAdd: true }); }).join('') : '<div class="empty-note">Nothing left in the pool right now.</div>') +
        '</div>' +
      '</details>' +
    '</section>';

    return out;
  }

  function renderLibrary() {
    var today = todayISO();
    var quick = [["Today", 0], ["1 wk ago", 7], ["1 mo ago", 30], ["2 mo ago", 60], ["4 mo+ / never", null]];
    var groups = [
      ["weekday", "Fixed-day tasks"],
      ["rotating", "Rotating tasks"],
      ["daily", "Daily (always on, no backfill needed)"],
      ["ondemand", "On demand (only when asked)"]
    ];
    var out = '';
    if (libraryFlash) {
      out += '<div class="banner"><p>' + escapeHtml(libraryFlash) + '</p></div>';
      libraryFlash = null;
    }
    if (!state.settings.bootstrapDone) {
      out += '<div class="banner"><p><strong>First, a quick backfill.</strong> Nothing in the sheet has a last-done date yet, so set roughly when each task was last actually done &mdash; that’s what makes tomorrow’s suggestions accurate. When you’re done, start the daily plan.</p>' +
        '<button class="btn" data-action="finish-bootstrap">Start using today’s plan</button></div>';
    }
    out += '<section><details class="pool" id="add-task-details">' +
        '<summary><span>+ Add a new task</span><span class="caret">&#9656;</span></summary>' +
        '<div class="settings-form" style="padding-top:12px;">' +
          '<div class="field"><label for="new-task-name">Task name</label>' +
            '<input id="new-task-name" type="text" placeholder="e.g. Clean fridge" /></div>' +
          '<div class="field"><label for="new-task-category">Type</label>' +
            '<select id="new-task-category">' +
              '<option value="rotating">Rotating &mdash; comes up every so often</option>' +
              '<option value="daily">Daily &mdash; every single day</option>' +
              '<option value="weekday">Fixed weekday &mdash; e.g. every Sunday</option>' +
              '<option value="ondemand">On demand &mdash; only when asked</option>' +
            '</select></div>' +
          '<div class="field" id="new-task-freq-field"><label for="new-task-freq">How many times a month?</label>' +
            '<input id="new-task-freq" type="number" min="0.1" step="0.1" placeholder="1 = monthly, 4 = weekly" /></div>' +
          '<div class="field" id="new-task-weekday-field" style="display:none;"><label for="new-task-weekday">Which day?</label>' +
            '<select id="new-task-weekday">' +
              ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(function (d) {
                return '<option value="' + d + '">' + d + '</option>';
              }).join('') +
            '</select></div>' +
          '<div class="field"><label for="new-task-time">Time taken (minutes)</label>' +
            '<input id="new-task-time" type="number" min="5" step="5" value="30" /></div>' +
          '<div class="field" id="new-task-lastdone-field"><label for="new-task-lastdone">Last done (optional, helps the first suggestion)</label>' +
            '<input id="new-task-lastdone" type="date" max="' + today + '" /></div>' +
          '<button class="btn" data-action="add-task" style="align-self:flex-start;">Add task</button>' +
          '<p class="save-hint" id="add-task-msg"></p>' +
        '</div>' +
      '</details></section>';
    groups.forEach(function (g) {
      var items = state.tasks.filter(function (t) { return t.category === g[0]; });
      if (!items.length) return;
      out += '<section><h2 class="section-title" style="margin-bottom:8px;">' + g[1] + '</h2><div class="lib-group">';
      items.forEach(function (t) {
        var needsBackfill = (g[0] === "weekday" || g[0] === "rotating");
        var last = deriveLastDone(t.id);
        out += '<div class="lib-row">' +
          '<span class="lib-name">' + escapeHtml(t.name) + '</span>' +
          '<span class="lib-meta">' + fmtDuration(t.timeMins) + (t.freqPerMonth ? ' &middot; every ' + Math.round(intervalDays(t)) + 'd' : '') + (t.weekday ? ' &middot; ' + t.weekday : '') + '</span>' +
          (needsBackfill ?
            '<span class="lib-meta">last: ' + (last ? escapeHtml(fmtDateLong(last)) : 'unknown') + '</span>' +
            '<div class="quickset">' +
              quick.map(function (q) {
                var iso = q[1] === null ? null : addDays(today, -q[1]);
                var active = last === iso;
                return '<button class="qbtn' + (active ? ' active' : '') + '" data-backfill="' + t.id + '" data-days="' + (q[1] === null ? 'null' : q[1]) + '">' + q[0] + '</button>';
              }).join('') +
              '<input class="datein" type="date" data-backfill-exact="' + t.id + '" value="' + (last || '') + '" max="' + today + '" />' +
            '</div>'
            : '') +
          '<button class="qbtn" data-edit-task="' + t.id + '">' + (editingTaskId === t.id ? 'Close' : 'Edit') + '</button>' +
        '</div>';
        if (editingTaskId === t.id) {
          out += '<div class="lib-row edit-form" style="flex-direction:column;align-items:stretch;">' +
            '<div class="settings-form">' +
              '<div class="field"><label for="edit-task-name">Task name</label>' +
                '<input id="edit-task-name" type="text" value="' + escapeHtml(t.name) + '" /></div>' +
              '<div class="field"><label for="edit-task-category">Type</label>' +
                '<select id="edit-task-category">' +
                  ["rotating","daily","weekday","ondemand"].map(function (c) {
                    var labels = { rotating: "Rotating — comes up every so often", daily: "Daily — every single day", weekday: "Fixed weekday — e.g. every Sunday", ondemand: "On demand — only when asked" };
                    return '<option value="' + c + '"' + (t.category === c ? ' selected' : '') + '>' + labels[c] + '</option>';
                  }).join('') +
                '</select></div>' +
              '<div class="field" id="edit-task-freq-field"><label for="edit-task-freq">How many times a month?</label>' +
                '<input id="edit-task-freq" type="number" min="0.1" step="0.1" value="' + (t.freqPerMonth || '') + '" /></div>' +
              '<div class="field" id="edit-task-weekday-field"><label for="edit-task-weekday">Which day?</label>' +
                '<select id="edit-task-weekday">' +
                  ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(function (d) {
                    return '<option value="' + d + '"' + (t.weekday === d ? ' selected' : '') + '>' + d + '</option>';
                  }).join('') +
                '</select></div>' +
              '<div class="field"><label for="edit-task-time">Time taken (minutes)</label>' +
                '<input id="edit-task-time" type="number" min="5" step="5" value="' + t.timeMins + '" /></div>' +
              '<div style="display:flex;gap:8px;">' +
                '<button class="btn" data-action="save-edit-task" data-task="' + t.id + '">Save</button>' +
                '<button class="qbtn" data-action="cancel-edit-task">Cancel</button>' +
              '</div>' +
              '<p class="save-hint" id="edit-task-msg"></p>' +
            '</div>' +
          '</div>';
        }
      });
      out += '</div></section>';
    });
    return out;
  }

  function renderHistory() {
    var dates = Object.keys(state.history).filter(function (d) { return state.history[d].length; }).sort().reverse();
    if (!dates.length) return '<section><p class="empty-note">Nothing logged yet &mdash; once tasks get checked off on the Today tab, they’ll show up here.</p></section>';
    var out = '<section>';
    dates.slice(0, 60).forEach(function (d) {
      var ids = state.history[d];
      var mins = ids.reduce(function (s, id) { var t = taskById(id); return s + (t ? t.timeMins : 0); }, 0);
      out += '<div class="history-day"><h3 class="history-date">' + escapeHtml(fmtDateLong(d)) + '</h3>' +
        '<div class="history-meta">' + ids.length + ' tasks &middot; ' + fmtDuration(mins) + '</div>' +
        '<div class="history-items">' + ids.map(function (id) {
          var t = taskById(id);
          return '<span class="history-pill">' + escapeHtml(t ? t.name : id) + '</span>';
        }).join('') + '</div></div>';
    });
    out += '</section>';
    return out;
  }

  function renderSettings() {
    return '<section><h2 class="section-title" style="margin-bottom:12px;">Settings</h2>' +
      '<div class="settings-form">' +
        '<div class="field"><label for="set-email">Email for the daily nudge</label>' +
          '<input id="set-email" type="email" placeholder="you@example.com" value="' + escapeHtml(state.settings.wifeEmail || '') + '" /></div>' +
        '<div class="field"><label for="set-budget">Daily minutes available (usually 180 = 3 hours)</label>' +
          '<input id="set-budget" type="number" min="30" max="600" step="5" value="' + state.settings.dailyBudgetMins + '" /></div>' +
        '<button class="btn" data-action="save-settings" style="align-self:flex-start;">Save</button>' +
        '<p class="save-hint">The time the morning email goes out is set outside this page &mdash; ask Shantanu to change it.</p>' +
      '</div>' +
    '</section>';
  }

  // ---------- events ----------
  function wireEvents() {
    var app = document.getElementById("app");
    app.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () { currentTab = btn.getAttribute("data-tab"); renderApp(); });
    });
    app.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("change", function () { toggleDone(el.getAttribute("data-toggle")); });
    });
    app.querySelectorAll("[data-remove]").forEach(function (el) {
      el.addEventListener("click", function () { removeFromToday(el.getAttribute("data-remove")); });
    });
    app.querySelectorAll("[data-add]").forEach(function (el) {
      el.addEventListener("click", function () { addToToday(el.getAttribute("data-add")); });
    });
    var finishBtn = app.querySelector('[data-action="finish-bootstrap"]');
    if (finishBtn) finishBtn.addEventListener("click", finishBootstrap);
    var budgetInput = document.getElementById("today-budget-input");
    if (budgetInput) budgetInput.addEventListener("change", function () {
      var v = parseInt(budgetInput.value, 10);
      if (!isNaN(v) && v > 0) setTodayBudget(v);
    });
    var resetBudgetBtn = app.querySelector('[data-action="reset-today-budget"]');
    if (resetBudgetBtn) resetBudgetBtn.addEventListener("click", resetTodayBudget);
    app.querySelectorAll("[data-backfill]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-backfill");
        var days = el.getAttribute("data-days");
        var iso = days === "null" ? null : addDays(todayISO(), -parseInt(days, 10));
        setBootstrap(id, iso);
      });
    });
    app.querySelectorAll("[data-backfill-exact]").forEach(function (el) {
      el.addEventListener("change", function () {
        setBootstrap(el.getAttribute("data-backfill-exact"), el.value || null);
      });
    });
    var saveBtn = app.querySelector('[data-action="save-settings"]');
    if (saveBtn) saveBtn.addEventListener("click", function () {
      var email = document.getElementById("set-email").value.trim();
      var budget = parseInt(document.getElementById("set-budget").value, 10);
      saveSettings(email, budget);
    });
    var newTaskCategory = document.getElementById("new-task-category");
    if (newTaskCategory) {
      var syncTaskFields = function () {
        var cat = newTaskCategory.value;
        var freqField = document.getElementById("new-task-freq-field");
        var wdField = document.getElementById("new-task-weekday-field");
        var lastField = document.getElementById("new-task-lastdone-field");
        if (freqField) freqField.style.display = (cat === "rotating" || cat === "weekday") ? "" : "none";
        if (wdField) wdField.style.display = (cat === "weekday") ? "" : "none";
        if (lastField) lastField.style.display = (cat === "rotating" || cat === "weekday") ? "" : "none";
      };
      newTaskCategory.addEventListener("change", syncTaskFields);
      syncTaskFields();
    }
    var addTaskBtn = app.querySelector('[data-action="add-task"]');
    if (addTaskBtn) addTaskBtn.addEventListener("click", function () {
      var name = (document.getElementById("new-task-name").value || "").trim();
      var category = document.getElementById("new-task-category").value;
      var timeMins = parseInt(document.getElementById("new-task-time").value, 10);
      var msgEl = document.getElementById("add-task-msg");
      if (!name) { if (msgEl) msgEl.textContent = "Give the task a name first."; return; }
      if (!timeMins || timeMins <= 0) { if (msgEl) msgEl.textContent = "Time taken should be a positive number of minutes."; return; }
      var freqPerMonth = null, weekday = null, lastDone = null;
      if (category === "rotating" || category === "weekday") {
        freqPerMonth = parseFloat(document.getElementById("new-task-freq").value);
        if (!freqPerMonth || freqPerMonth <= 0) { if (msgEl) msgEl.textContent = "Enter how many times a month this should happen."; return; }
        lastDone = document.getElementById("new-task-lastdone").value || null;
      }
      if (category === "weekday") {
        weekday = document.getElementById("new-task-weekday").value;
      }
      libraryFlash = "Added “" + name + "”.";
      addCustomTask({ name: name, category: category, timeMins: timeMins, freqPerMonth: freqPerMonth, weekday: weekday, lastDone: lastDone });
    });
    app.querySelectorAll("[data-edit-task]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-edit-task");
        editingTaskId = (editingTaskId === id) ? null : id;
        renderApp();
      });
    });
    var editCategorySel = document.getElementById("edit-task-category");
    if (editCategorySel) {
      var syncEditFields = function () {
        var cat = editCategorySel.value;
        var freqField = document.getElementById("edit-task-freq-field");
        var wdField = document.getElementById("edit-task-weekday-field");
        if (freqField) freqField.style.display = (cat === "rotating" || cat === "weekday") ? "" : "none";
        if (wdField) wdField.style.display = (cat === "weekday") ? "" : "none";
      };
      editCategorySel.addEventListener("change", syncEditFields);
      syncEditFields();
    }
    var saveEditBtn = app.querySelector('[data-action="save-edit-task"]');
    if (saveEditBtn) saveEditBtn.addEventListener("click", function () {
      var taskId = saveEditBtn.getAttribute("data-task");
      var name = (document.getElementById("edit-task-name").value || "").trim();
      var category = document.getElementById("edit-task-category").value;
      var timeMins = parseInt(document.getElementById("edit-task-time").value, 10);
      var msgEl = document.getElementById("edit-task-msg");
      if (!name) { if (msgEl) msgEl.textContent = "Give the task a name first."; return; }
      if (!timeMins || timeMins <= 0) { if (msgEl) msgEl.textContent = "Time taken should be a positive number of minutes."; return; }
      var freqPerMonth = null, weekday = null;
      if (category === "rotating" || category === "weekday") {
        freqPerMonth = parseFloat(document.getElementById("edit-task-freq").value);
        if (!freqPerMonth || freqPerMonth <= 0) { if (msgEl) msgEl.textContent = "Enter how many times a month this should happen."; return; }
      }
      if (category === "weekday") {
        weekday = document.getElementById("edit-task-weekday").value;
      }
      libraryFlash = "Updated “" + name + "”.";
      editingTaskId = null;
      updateTask(taskId, { name: name, category: category, timeMins: timeMins, freqPerMonth: freqPerMonth, weekday: weekday });
    });
    var cancelEditBtn = app.querySelector('[data-action="cancel-edit-task"]');
    if (cancelEditBtn) cancelEditBtn.addEventListener("click", function () {
      editingTaskId = null;
      renderApp();
    });
  }

  renderApp();
})();
</script>
</body>
</html>
